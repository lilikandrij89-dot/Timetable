<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>272-2 Розклад</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ece9e2;
            --surface: #f9f8f5;
            --surface-card: #ffffff;
            --surface-subtle: #f0eee9;
            --accent: #c25e2e;
            --accent-soft: rgba(194, 94, 46, 0.12);
            --text-main: #232220;
            --text-muted: #7d7a74;
            --border: #dfdbd2;
            --border-card: #e8e5dc;
            --shadow-card: 0 4px 16px rgba(45, 41, 38, 0.04), 0 1px 3px rgba(45, 41, 38, 0.03);
            --shadow-nav: 0 12px 30px rgba(45, 41, 38, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            min-height: 100%;
            background: var(--bg);
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background: radial-gradient(circle at 100% 0%, #f4f1ea 0%, var(--bg) 100%);
            background-attachment: fixed;
            color: var(--text-main);
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        #app {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 24px 18px calc(105px + env(safe-area-inset-bottom, 0px));
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            flex-shrink: 0;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.6px;
            color: var(--text-main);
        }

        .week-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 999px;
            color: var(--accent);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.4px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
            text-transform: uppercase;
        }

        .week-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
        }

        #schedule-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .para-card {
            background: var(--surface-card);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--border-card);
            box-shadow: var(--shadow-card);
            animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) backwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .para-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .para-meta-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .para-num {
            color: var(--accent);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.6px;
        }

        .para-time {
            font-size: 11px;
            font-weight: 700;
            color: #55524c;
            background: var(--surface-subtle);
            padding: 3px 8px;
            border-radius: 6px;
            letter-spacing: 0.2px;
        }

        .para-type {
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            background: var(--surface-subtle);
            color: #55524c;
            border: 1px solid var(--border);
        }

        .para-name {
            font-size: 17px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        .vd-item {
            background: var(--surface-subtle);
            margin-top: 10px;
            padding: 12px;
            border-radius: 12px;
            border-left: 3px solid var(--accent);
        }

        .vd-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
        }

        .vd-info {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .para-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            border-top: 1px solid var(--surface-subtle);
            padding-top: 14px;
        }

        .detail-item strong {
            display: block;
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .detail-item span {
            font-size: 13px;
            font-weight: 600;
            color: #42403b;
        }

        .nav-bar {
            position: fixed;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 448px;
            background: rgba(249, 248, 245, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            display: flex;
            padding: 5px;
            gap: 4px;
            box-shadow: var(--shadow-nav);
            z-index: 1000;
        }

        .nav-item {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 700;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-item.active {
            color: #ffffff;
            background: var(--accent);
            box-shadow: 0 4px 14px rgba(194, 94, 46, 0.35);
        }
    </style>
</head>
<body>
    <main id="app">
        <header>
            <h1 id="day-name">---</h1>
            <div class="week-badge"><span id="week-text">... ТИЖДЕНЬ</span></div>
        </header>
        <div id="schedule-list"></div>
    </main>

    <nav class="nav-bar">
        <div class="nav-item" onclick="changeDay(1, this)">ПН</div>
        <div class="nav-item" onclick="changeDay(2, this)">ВТ</div>
        <div class="nav-item" onclick="changeDay(3, this)">СР</div>
        <div class="nav-item" onclick="changeDay(4, this)">ЧТ</div>
        <div class="nav-item" onclick="changeDay(5, this)">ПТ</div>
    </nav>

    <script src="data.js"></script>
    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.setHeaderColor?.('#ece9e2');
            tg.setBackgroundColor?.('#ece9e2');
        }

        const lessonTimes = {
            1: "08:30 – 09:50",
            2: "10:00 – 11:20",
            3: "11:40 – 13:00",
            4: "13:10 – 14:30",
            5: "14:40 – 16:00",
            6: "16:10 – 17:30",
            7: "17:40 – 19:00"
        };

        function getAcademicWeek() {
            const startDate = new Date(2026, 7, 31); 
            const now = new Date();

            const diffTime = now.getTime() - startDate.getTime();
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays < 0) return 1;

            const passedWeeks = Math.floor(diffDays / 7);
            return (passedWeeks % 2 === 0) ? 1 : 2;
        }

        const currentWeek = getAcademicWeek();
        document.getElementById('week-text').innerText = `${currentWeek}-Й ТИЖДЕНЬ`;

        function renderSchedule(dayId) {
            const day = timetableData[dayId];
            if (!day) return;

            document.getElementById('day-name').innerText = day.name;
            const list = document.getElementById('schedule-list');
            list.innerHTML = '';

            day.lessons.forEach((l, index) => {
                let lesson = (l.week1 || l.week2) ? (currentWeek === 1 ? l.week1 : l.week2) : l;
                if (!lesson || lesson.name === "НЕМА") return;

                const timeStr = lessonTimes[l.num] || '';

                let html = `
                    <div class="para-card" style="animation-delay: ${index * 0.04}s">
                        <div class="para-header">
                            <div class="para-meta-left">
                                <span class="para-num">№${l.num}</span>
                                ${timeStr ? `<span class="para-time">${timeStr}</span>` : ''}
                            </div>
                            <span class="para-type">${lesson.type || 'Пара'}</span>
                        </div>
                        <div class="para-name">${lesson.name}</div>`;

                if (lesson.isVD) {
                    lesson.choices.forEach(c => {
                        html += `
                            <div class="vd-item">
                                <div class="vd-title">${c.title}</div>
                                <div class="vd-info">${c.teacher || '---'} • ${c.room || '---'}</div>
                            </div>`;
                    });
                } else {
                    html += `
                        <div class="para-details">
                            <div class="detail-item"><strong>Викладач</strong><span>${lesson.teacher || '---'}</span></div>
                            <div class="detail-item"><strong>Аудиторія</strong><span>${lesson.room || '---'}</span></div>
                        </div>`;
                }

                html += `</div>`;
                list.innerHTML += html;
            });
            window.scrollTo({ top: 0, behavior: 'instant' });
        }

        function changeDay(id, el) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            renderSchedule(id);
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        let today = new Date().getDay();
        if (today === 0 || today === 6) today = 1;
        const navItems = document.querySelectorAll('.nav-item');
        if (navItems[today - 1]) {
            changeDay(today, navItems[today - 1]);
        }
    </script>
</body>
</html>
